name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, feat/curricular-bottlenecks]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # the real dataset is private, so the demo ships synthetic data
      - run: python3 scripts/generate_demo_data.py _site/data/departments
      - run: |
          mkdir -p _site/node_modules/@flaticon
          cp -r src _site/src
          cp -r node_modules/@flaticon/flaticon-uicons _site/node_modules/@flaticon/
          echo '<meta http-equiv="refresh" content="0; url=src/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
