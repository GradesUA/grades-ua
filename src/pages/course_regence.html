<section class="degree-management">
    <div class="search-header">
        <h2 data-i18n="nav.cr.eyebrow"></h2>
        <h1 data-i18n="nav.cr.title"></h1>
        <div class="search-container">

            <!-- <div class="op-container">
                <label for="filter-course">Course</label>
                <select id="filter-course"></select>
            </div> -->

            <div class="op-container">
                <label for="filter-course-input" data-i18n="cr.course"></label>
                <div id="filter-course-box" class="searchable-select">
                    <div class="search-input-wrapper">
                        <input
                            type="text"
                            id="filter-course-input"
                            data-i18n-placeholder="cr.placeholderAll"
                            autocomplete="off"
                        />
                        <button type="button" id="btn-clear-course" class="clear-btn" data-i18n-title="common.clear" data-i18n-aria="common.clear" hidden>
                            <i class="fi fi-br-cross-small"></i>
                        </button>
                    </div>
                    <div id="filter-course-options" class="dropdown-options"></div>
                </div>
            </div>
            
            <div class="op-container">
                <label for="filter-department" data-i18n="common.department"></label>
                <select id="filter-department"></select>
            </div>

            <div class="op-container">
                <label for="btn-years-dropdown" data-i18n="common.academicYear"></label>
                <div id="filter-years" class="multi-select">
                    <button type="button" id="btn-years-dropdown" class="dropdown-btn">
                        <span></span>
                        <i class="fi fi-br-angle-small-down"></i>
                    </button>

                    <div id="filter-years-options" class="dropdown-options"></div>
                </div>
            </div>

            <button type="button" id="btn-reset" class="btn-reset">
                <i class="fi fi-br-rotate-right"></i><span data-i18n="common.reset"></span>
            </button>

        </div>
    </div>

    <div class="charts-layout">
        <article class="chart-container chart-card">
            <header class="card-header">
                <h3 data-i18n="cr.divergingTitle"></h3>
                <span id="degrees-badge" class="badge"></span>
            </header>
            <div id="course-diverging-chart" class="chart-body"></div>
            <footer id="course-diverging-footer" class="card-footer"></footer>
        </article>
        
        <article class="chart-container chart-card">
            <header class="card-header">
                <h3 id="exam-stacked-title" data-i18n="cr.stackedTitle"></h3>
                <span id="exam-scope-badge" class="badge"></span>
            </header>
            <div id="exam-stacked-chart" class="chart-body"></div>
            <footer id="exam-stacked-footer" class="card-footer"></footer>
        </article>
    </div>
</section>
