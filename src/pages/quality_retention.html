<section class="degree-management">
    <div class="search-header">
        <h2>QUALITY & RETENTION</h2>
        <h1>Institutional & Equity</h1>
        <div class="search-container">
            <div class="op-container">
                <label for="filter-department">Department</label>
                <select id="filter-department"></select>
            </div>

            <div class="op-container">
                <label for="filter-year">Academic Year</label>
                <select id="filter-year"></select>
            </div>

            <div class="op-container">
                <label for="filter-metric">Grouping Metric</label>
                <select id="filter-metric"></select>
            </div>

            <button type="button" id="btn-reset" class="btn-reset">
                <i class="fi fi-br-rotate-right"></i>Reset view
            </button>
        </div>
    </div>
    <div class="charts-layout">
        
        <article class="chart-container chart-card">
            <header class="card-header">
                <h3>Student Equity & Outcome Flow</h3>
                <span id="sankey-badge" class="badge">ALL ENROLMENTS</span>
            </header>
            <div id="sankey-chart" class="chart-body"></div>
            <footer id="sankey-footer" class="card-footer"></footer>
        </article>
        
        <article class="chart-container chart-card">
            <header class="card-header">
                <h3 id="diverging-title">Equity Gap by Demographic</h3>
                <span id="diverging-badge" class="badge">PASS vs FAIL</span>
            </header>
            <div id="diverging-chart" class="chart-body"></div>
            <footer id="diverging-footer" class="card-footer"></footer>
        </article>
    </div>
</section>
