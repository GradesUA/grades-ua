<section class="degree-management">
    <div class="search-header">
        <h2>DEGREE MANAGEMENT</h2>
        <h1>Curricular Bottlenecks</h1>
        <div class="search-container">
            
            <div class="op-container">
                <label for="search-course">Department</label>
                <select id="search-course" name="search-course">
                    <option value="" disabled selected>Select a course...</option>
                    <option value="math">Mathematics</option>
                    <option value="programming">Programming</option>
                    <option value="statistics">Statistics</option>
                </select>
            </div>

            <div class="op-container">
                <label for="search-year">Degree</label>
                <select id="search-year" name="search-year">
                    <option value="" disabled selected>Select an academic year...</option>
                    <option value="2025-2026">2025/2026</option>
                    <option value="2024-2025">2024/2025</option>
                    <option value="2023-2024">2023/2024</option>
                </select>
            </div>

            <div class="op-container">
                <label for="search-year">Curricular Year</label>
                <select id="search-year" name="search-year">
                    <option value="" disabled selected>Select an academic year...</option>
                    <option value="2025-2026">2025/2026</option>
                    <option value="2024-2025">2024/2025</option>
                    <option value="2023-2024">2023/2024</option>
                </select>
            </div>

            <div class="op-container">
                <label>Academic Year</label>

                <div class="multi-select">
                    <button type="button" class="dropdown-btn">
                        <span>Select academic years...</span>
                        <i class="fi fi-br-angle-small-down"></i>
                    </button>

                    <div class="dropdown-options">
                        <label>
                            <input type="checkbox" value="2022/2023">
                            2022/2023
                        </label>
                        <label>
                            <input type="checkbox" value="2023/2024">
                            2023/2024
                        </label>
                        <label>
                            <input type="checkbox" value="2024/2025">
                            2024/2025
                        </label>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="charts-layout">

        <div class="chart-container"></div>
        <div class="chart-container"></div>

    </div>
</section>
